<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRISM BREAK — Shatter the spectrum</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #05070f;
    min-height: 100%;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
  }
  #wrap {
    width: min(1280px, 100%);
    line-height: 0;
  }
  canvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
    box-shadow: 0 0 60px rgba(76, 201, 240, 0.18), 0 0 0 1px rgba(255, 255, 255, 0.08);
    cursor: crosshair;
    background: #0a0d1e;
  }
  #foot {
    width: min(1280px, 100%);
    display: flex;
    justify-content: space-between;
    color: rgba(255, 255, 255, 0.45);
    font-size: 13px;
    line-height: 1.4;
    padding: 10px 4px 0;
  }
  #foot b { color: rgba(255, 255, 255, 0.75); font-weight: 600; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<div id="foot">
  <span><b>PRISM BREAK</b> — a neon breakout. Shatter every prism, keep the ball alive.</span>
  <span>Mouse / ← → move &nbsp;·&nbsp; Space launch &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M mute &nbsp;·&nbsp; R restart</span>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
